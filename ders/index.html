<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="../favicon.png">
<title>Islamzade Studio — Onlayn dərs</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b2219;color:#f3efe2;font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
  .hide{display:none!important}
  .center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:#143a2a;border:2px solid #c9a227;border-radius:16px;padding:24px 26px;max-width:440px;width:100%}
  h1{margin:0 0 6px;font-size:22px;color:#f5d97a}
  p{line-height:1.5;margin:8px 0}
  input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #3d6b55;background:#0b2219;color:#fff;font-size:16px;margin:10px 0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#c9a227;color:#111;font-weight:700;padding:12px 18px;border-radius:10px;border:0;font-size:15px;cursor:pointer;font-family:inherit}
  .btn.wide{width:100%}
  .btn.ghost{background:transparent;color:#f3efe2;border:1px solid #3d6b55}
  .muted{opacity:.75;font-size:13px}
  .lang{position:fixed;top:10px;right:10px;display:flex;gap:4px;z-index:5}
  .lang button{background:#143a2a;color:#cfe;border:1px solid #3d6b55;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px}
  .lang button.on{background:#c9a227;color:#111}
  #room{display:flex;flex-direction:column;height:100%}
  #stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px}
  #mainWrap{flex:1;min-height:0;position:relative;background:#000;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  #mainVid{width:100%;height:100%;object-fit:contain;background:#000}
  #mainMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#cfe}
  #strip{display:flex;gap:6px;overflow-x:auto;min-height:0}
  .tile{position:relative;flex:0 0 auto;width:150px;aspect-ratio:16/9;background:#173d2d;border-radius:8px;overflow:hidden;border:2px solid transparent}
  .tile.talk{border-color:#c9a227}
  .tile video{width:100%;height:100%;object-fit:cover}
  .tile .nm{position:absolute;left:4px;bottom:3px;right:4px;font-size:12px;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;color:#9cc}
  #bar{display:flex;justify-content:center;gap:8px;padding:10px;background:#0f2c20;border-top:1px solid #234f3c;flex-wrap:wrap}
  #bar .btn{min-width:84px;flex-direction:column;gap:2px;padding:8px 10px;font-size:12px;background:#1d4a37;color:#f3efe2}
  #bar .btn b{font-size:20px;line-height:1}
  #bar .btn.on{background:#c9a227;color:#111}
  #bar .btn.off{background:#7a2626}
  #bar .btn.lock{opacity:.55}
  #bar .btn.leave{background:#5a1d1d}
  #toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#173d2d;border:1px solid #c9a227;border-radius:10px;padding:10px 16px;z-index:20;max-width:92%;text-align:center}
  #ask{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
  .row{display:flex;gap:8px;margin-top:14px}
  .row .btn{flex:1}
  @media (max-width:600px){ .tile{width:110px} #bar .btn{min-width:64px} }
</style>
</head>
<body>
<div class="lang"><button data-l="az">AZ</button><button data-l="tr">TR</button></div>

<div id="scrJoin" class="center"><div class="card">
  <h1>🕌 <span data-t="title"></span></h1>
  <p data-t="joinHint"></p>
  <input id="name" type="text" maxlength="40" autocomplete="name">
  <button id="joinBtn" class="btn wide" data-t="join"></button>
  <p class="muted" data-t="privacy"></p>
  <p id="joinErr" class="muted" style="color:#ffb3b3"></p>
</div></div>

<div id="scrMsg" class="center hide"><div class="card">
  <h1 id="msgTitle"></h1>
  <p id="msgBody"></p>
  <button id="msgBtn" class="btn wide hide"></button>
</div></div>

<div id="room" class="hide">
  <div id="stage">
    <div id="mainWrap"><video id="mainVid" autoplay playsinline></video><div id="mainMsg"></div></div>
    <div id="strip"></div>
  </div>
  <div id="bar">
    <button id="bHand" class="btn"><b>🙋</b><span data-t="hand"></span></button>
    <button id="bMic" class="btn off"><b>🎤</b><span data-t="mic"></span></button>
    <button id="bCam" class="btn off"><b>📷</b><span data-t="cam"></span></button>
    <button id="bLeave" class="btn leave"><b>🚪</b><span data-t="leave"></span></button>
  </div>
</div>

<div id="ask" class="hide"><div class="card">
  <h1 id="askTitle"></h1>
  <div class="row"><button id="askYes" class="btn" data-t="yesOpen"></button><button id="askNo" class="btn ghost" data-t="no"></button></div>
</div></div>
<div id="toast" class="hide"></div>

<script src="vdoninja-sdk.min.js"></script>
<script src="ders.js"></script>
</body>
</html>
